[build]
  publish = "."

# ---------------------------------------------------------------------------
# Caching
# Netlify's default is `public,max-age=0,must-revalidate`, which forces a
# revalidation round-trip for every image on every visit. Assets here are
# content-stable, so give them a long immutable TTL. HTML stays revalidating so
# copy fixes go live the moment they deploy.
# If an asset's CONTENT changes, change its FILENAME (or the old file will be
# served from cache for a year).
# ---------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
